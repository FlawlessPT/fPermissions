name: fPermissions
main: pt.flawless.fpermissions.FPermissions
api-version: '1.21'
version: 1.0
description: Grupos de permissões e permissões individuais
depend: [fAPI, fDatabase]
commands:
  grupo:
    description: Mostra os teus grupos e gere os grupos dos jogadores e as permissões dos grupos (só admins)
    permission-message: "§cNão tens permissão."
    usage: "/grupo | /grupo list [jogador] | /grupo add|remove <jogador> <grupo> | /grupo info <grupo> | /grupo addperm|removeperm <grupo> <permissão> | /grupo groups | /grupo check <jogador> <permissão> | /grupo reload | /grupo help"
    aliases: [grupos]
    permission: fpermissions.admin
  perm:
    description: Gere as permissões individuais dos jogadores
    permission-message: "§cNão tens permissão."
    usage: "/perm add|remove <jogador> <permissão> | /perm list <jogador> | /perm help"
    aliases: [permissao]
    permission: fpermissions.admin
permissions:
  fpermissions.admin:
    description: Permite usar /grupo e /perm, incluindo os respetivos help
    default: op
