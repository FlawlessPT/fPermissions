# Grupo atribuído a todos os jogadores.
default-group: membro

# Permissões em uso nos plugins:
#   fshop.admin, feconomy.admin, fservercore.setspawn, barberians.staff
# "*" dá tudo; "a.b.*" dá a subárvore; "-nó" nega (a negação ganha sempre).
groups:
  membro:
    permissions: []
  vip:
    inherits: [membro]
  admin:
    inherits: [vip]
    permissions:
      - "*"
