# Grupo atribuído a todos os jogadores.
default-group: membro

# O OP e o "default:" dos plugin.yml já NÃO contam: só vale o que está nos grupos e nas permissões do jogador.
# Permissões em uso nos plugins (o "admin" tem-nas todas por "*"):
#   fshop.admin, feconomy.admin, fservercore.setspawn, barberians.staff (staff do fUtilities)
#   comandos.use (menu /comandos do fUtilities; dar a quem o deve ver)
# "*" dá tudo; "a.b.*" dá a subárvore; "-nó" nega (a negação ganha sempre).
groups:
  membro:
    permissions:
      - minecraft.command.tell   # /tell
      - minecraft.command.me     # /me
      - bukkit.command.help      # /help
      - bukkit.broadcast.user    # receber broadcasts públicos
  vip:
    inherits: [membro]
  admin:
    inherits: [vip]
    permissions:
      - "*"
